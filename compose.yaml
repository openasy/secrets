# Secrets. CI sends SARIF from gitleaks or TruffleHog and gets back whether the check passes. The secrets are never kept (ADR 0038).
#
#   openssl rand -hex 32 > openasy-kek   # secrets's key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs secrets | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  secrets:
    image: ghcr.io/openasy/secrets:0.4.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - secrets-data:/data # SQLite database: repositories, scans, findings (never the secrets) and decisions
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open Secrets at; with a TLS proxy in front, its https:// URL.
      SECRETS_PUBLIC_URL: ${SECRETS_PUBLIC_URL:-http://localhost:8080}
      # For CI: it can send scans and nothing else. Or use an API token with the editor role from Settings.
      SECRETS_INGEST_TOKEN: ${SECRETS_INGEST_TOKEN:-}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: secrets
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  secrets-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
